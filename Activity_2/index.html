<!DOCTYPE html>

<html lang="en" data-bs-theme="dark">

<head>
  <title>Genshin Characters</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <style>
    .character-star {
      width: clamp(18px, 5vw, 25px);
      height: auto;
    }

    .character-element-icon {
      width: clamp(36px, 10vw, 52px);
      height: auto;
      flex: 0 0 auto;
    }
  </style>
</head>

<body class="bg-black">

  <div class="container my-5">
    <div class="card bg-dark border-secondary rounded-4 overflow-hidden mb-4" style="height: 260px;">

      <img src="assets/bgpic.gif" alt="Genshin Characters dashboard" class="w-100 h-100 object-fit-cover" />
      
      <div class="position-absolute w-100 h-100 d-flex flex-column align-items-center justify-content-center text-center p-3">
        <div class="p-1 p-sm-4">
          <h2 class="fw-bold text-white">Welcome to Genshin Characters</h2>
          <p class="text-light">
            "Your voyage has brought you through the skies.
            Across the celestial atlas divided by stardust.
            When the rulers divine look down upon the earthly realms.
            Whither leads your path, Traveler?"
          </p>
        </div>
      </div>
    </div>

    <div class="row g-4">

      <div class="col-12 col-md-4 col-lg-3">

        <div class="sticky-top" style="top: 2rem;">
          <div class="card bg-dark border-secondary rounded-4 p-4 text-center">

            <div class="d-flex justify-content-center mb-3">
              <img src="assets/profilepic.jpg" alt="Botoru"
                class="rounded-circle border border-secondary object-fit-cover" style="width: 150px; height: 150px;" />
            </div>

            <h4 class="fw-bold mb-1">Botoru</h4>
            <p class="text-secondary small mb-4">UID: 816919420</p>

            <hr class="opacity-100" />

            <div class="text-start mt-2">
              <h5 class="fw-bold mb-3">Element Categories</h5>
              <div class="nav flex-column gap-2">
                <button type="button" data-section="cryo" class="btn btn-outline-light w-100 border-0 text-start fw-medium" onclick="window.location.href='#cryo'">Cryo</button>
                <button type="button" data-section="pyro" class="btn btn-outline-light w-100 border-0 text-start fw-medium" onclick="window.location.href='#pyro'">Pyro</button>
                <button type="button" data-section="hydro" class="btn btn-outline-light w-100 border-0 text-start fw-medium" onclick="window.location.href='#hydro'">Hydro</button>
                <button type="button" data-section="dendro" class="btn btn-outline-light w-100 border-0 text-start fw-medium" onclick="window.location.href='#dendro'">Dendro</button>
                <button type="button" data-section="electro" class="btn btn-outline-light w-100 border-0 text-start fw-medium" onclick="window.location.href='#electro'">Electro</button>
                <button type="button" data-section="geo" class="btn btn-outline-light w-100 border-0 text-start fw-medium" onclick="window.location.href='#geo'">Geo</button>
                <button type="button" data-section="anemo" class="btn btn-outline-light w-100 border-0 text-start fw-medium" onclick="window.location.href='#anemo'">Anemo</button>
              </div>
            </div>

          </div>
        </div>
      </div>

      <div class="col-12 col-md-8 col-lg-9">
        <div id="parent">
          <!-- This empty space will be generated by JavaScript -->
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <script>
    var characterData = [
      {
        category: "Cryo",
        elementIcon: "assets/elements/cryo.jpg",
        characters: [
          { name: "Tsaritsa", image: "assets/cryo_characters/tsaritsa.jpg" },
          { name: "Sandrone", image: "assets/cryo_characters/sandrone.jpg" },
          { name: "Odette", image: "assets/cryo_characters/odette.jpg" },
          { name: "Skirk", image: "assets/cryo_characters/skirk.jpg" },
          { name: "Escoffier", image: "assets/cryo_characters/escoffier.jpg" },
          { name: "Citlali", image: "assets/cryo_characters/citlali.jpg" },
          { name: "Ayaka", image: "assets/cryo_characters/ayaka.jpg" },
          { name: "Shenhe", image: "assets/cryo_characters/shenhe.jpg" },
          { name: "Ganyu", image: "assets/cryo_characters/ganyu.jpg" },
          { name: "Eula", image: "assets/cryo_characters/eula.jpg" }
        ]
      },
      {
        category: "Pyro",
        elementIcon: "assets/elements/pyro.jpg",
        characters: [
          { name: "Mavuika", image: "assets/pyro_characters/mavuika.jpg" },
          { name: "Arlecchino", image: "assets/pyro_characters/arlecchino.jpg" },
          { name: "Nicole", image: "assets/pyro_characters/nicole.jpg" },
          { name: "Yoimiya", image: "assets/pyro_characters/yoimiya.jpg" },
          { name: "Hutao", image: "assets/pyro_characters/hutao.jpg" }
        ]
      },
      {
        category: "Hydro",
        elementIcon: "assets/elements/hydro.jpg",
        characters: [
          { name: "Furina", image: "assets/hydro_characters/furina.jpg" },
          { name: "Columbina", image: "assets/hydro_characters/columbina.jpg" },
          { name: "Vodyanista", image: "assets/hydro_characters/vodyanista.jpg" },
          { name: "Nilou", image: "assets/hydro_characters/nilou.jpg" },
          { name: "Yelan", image: "assets/hydro_characters/yelan.jpg" },
          { name: "Kokomi", image: "assets/hydro_characters/kokomi.jpg" }
        ]
      },
      {
        category: "Dendro",
        elementIcon: "assets/elements/dendro.jpg",
        characters: [
          { name: "Nahida", image: "assets/dendro_characters/nahida.jpg" },
          { name: "Lauma", image: "assets/dendro_characters/lauma.jpg" },
          { name: "Nefer", image: "assets/dendro_characters/nefer.jpg" },
          { name: "Emilie", image: "assets/dendro_characters/emilie.jpg" }
        ]
      },
      {
        category: "Electro",
        elementIcon: "assets/elements/electro.jpg",
        characters: [
          { name: "Raiden Shogun", image: "assets/electro_characters/raiden_shogun.jpg" },
          { name: "Yae Miko", image: "assets/electro_characters/yae_miko.jpg" },
          { name: "Danica", image: "assets/electro_characters/danica.jpg" },
          { name: "Ineffa", image: "assets/electro_characters/ineffa.jpg" },
          { name: "Varesa", image: "assets/electro_characters/varesa.jpg" },
          { name: "Clorinde", image: "assets/electro_characters/clorinde.jpg" },
          { name: "Keqing", image: "assets/electro_characters/keqing.jpg" }
        ]
      },
      {
        category: "Geo",
        elementIcon: "assets/elements/geo.jpg",
        characters: [
          { name: "Zhongli", image: "assets/geo_characters/zhongli.jpg" },
          { name: "Zibai", image: "assets/geo_characters/zibai.jpg" },
          { name: "Linnea", image: "assets/geo_characters/linnea.jpg" },
          { name: "Zilonen", image: "assets/geo_characters/zilonen.jpg" },
          { name: "Chiori", image: "assets/geo_characters/chiori.jpg" },
          { name: "Navia", image: "assets/geo_characters/navia.jpg" }
        ]
      },
      {
        category: "Anemo",
        elementIcon: "assets/elements/anemo.jpg",
        characters: [
          { name: "Venti", image: "assets/anemo_characters/venti.jpg" },
          { name: "Vesna", image: "assets/anemo_characters/vesna.jpg" },
          { name: "Chasca", image: "assets/anemo_characters/chasca.jpg" },
          { name: "Mizuki", image: "assets/anemo_characters/mizuki.jpg" },
          { name: "Xianyun", image: "assets/anemo_characters/xianyun.jpg" },
          { name: "Jean", image: "assets/anemo_characters/jean.jpg" }
        ]
      }
    ];
    var Parent = document.getElementById("parent");

    for (var i = 0; i < characterData.length; i++) {
      var group = characterData[i];

      var htmlContent =
        `
          <div class="mb-5" id="${group.category.toLowerCase()}">
            <h3 class="fw-bold">${group.category} Characters</h3><hr class="bg-white opacity-100 mb-4"/>
          <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
        `;
      for (var j = 0; j < group.characters.length; j++) {
        var char = group.characters[j];

        htmlContent +=
          `
            <div class="col">
              <div class="card bg-dark border-secondary overflow-hidden h-100" style="aspect-ratio: 3/4;">

                <img src="${char.image}" alt="${char.name}" class="w-100 h-100 object-fit-cover" />

                <div class="position-absolute top-0 start-0 p-2" style="background: linear-gradient(to bottom, rgba(0,0,0,1), transparent);">
                  <img src="assets/stars.svg" alt="Stars" class="character-star" />
                </div>

                <div class="position-absolute bottom-0 start-0 end-0 p-2 d-flex flex-wrap align-items-center justify-content-center gap-2" style="background: linear-gradient(to top, rgba(0,0,0,1), transparent);">
                  <img src="${group.elementIcon}" alt="${group.category}" class="character-element-icon object-fit-contain" />
                  <span class="fw-bold fs-5 text-white text-center text-break">${char.name}</span>
                </div>

              </div>
            </div>
          `;
      }
      htmlContent += `
            </div>
          </div>
        `;
      Parent.innerHTML += htmlContent;
    }
  </script>

</body>

</html>
