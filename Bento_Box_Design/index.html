<!DOCTYPE html>

<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bento Box Design</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<style>
    body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }
    .container {
        margin-block: auto;
    }
    .card {
        min-height: 200px;
    }
    #bg-card {
        background-image: url('assets/bgpic.gif');
        background-size: cover;
    }
    #profile-img-container {
        width: 210px;
        height: 210px;
    }
</style>

<body data-bs-theme="dark">
    <div class="container p-5">

        <div class="row g-3">

            <div class="col-12 col-lg-5 p-3">

                <div class="row mb-3">
                    <div class="col-12">
                        <div class="card p-4 bg-black rounded-4 d-flex flex-column align-items-center justify-content-center text-center"
                            style="height: 460px;">
                            <div id="profile-img-container"
                                class="mb-3 border border-5 border-inverse border-10 rounded-circle overflow-hidden">
                                <img src="assets/profilepic.jpg" class="w-100 h-100 object-fit-cover">
                            </div>
                            <h4 class="fw-bold mb-1 text-light">Distinct</h4>
                            <p class="fw-semibold text-secondary small">Genshin Impact Player</p>
                        </div>
                    </div>
                </div>

                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <div class="card bg-black rounded-4 overflow-hidden" style="height: 100%; min-height: 200px;">
                            <img src="assets/capitano.jpg" class="w-100 h-100" alt="Capitano"
                                style="object-fit: cover;">
                        </div>
                    </div>
                    <div class="col-12 col-md-6">
                        <div class="card bg-black rounded-4 overflow-hidden" style="height: 100%; min-height: 200px;">
                            <img src="assets/dottore.jpg" class="w-100 h-100" alt="Dottore"
                                style="object-fit: cover;">
                        </div>
                    </div>
                </div>

            </div>

            <div class="col-12 col-lg-7 p-2">

                <div class="row">
                    <div class="col-sm-12 p-2">
                        <div id="bg-card"
                            class="card p-4 bg-black rounded-4 d-flex flex-column align-items-center justify-content-center text-center"
                            style="height: 100%; width: 100%;">
                            <p class="fw-bold mt-3 text-light">
                                "Your voyage has brought you through the skies.
                                Across the celestial atlas divided by stardust.
                                When the rulers divine look down upon the earthly realms.
                                Whither leads your path, Traveler?"
                            </p>
                        </div>

                    </div>
                </div>

                <div class="row">

                    <div class="col-12 col-md-8 p-2">
                        <div class="row">

                            <div class="col-12 p-2">

                                <div class="card bg-black rounded-4 d-flex flex-row align-items-center justify-content-around p-3 gap-5 flex-wrap"
                                    style="height: 100%; min-height: 235px;">

                                    <div class="d-flex align-items-center gap-3">
                                        <div class="rounded-circle overflow-hidden"
                                            style="width: 40px; height: 40px; flex-shrink: 0;">
                                            <img src="assets/clock.png" class="w-100 h-100 object-fit-cover">
                                        </div>
                                        <span id="live-clock" class="fs-4 fw-semibold text-light"></span>
                                    </div>

                                    <div class="d-flex align-items-center gap-2">
                                        <div class="rounded-circle overflow-hidden"
                                            style="width: 40px; height: 40px; flex-shrink: 0;">
                                            <img src="assets/calendar.png" class="w-100 h-100 object-fit-cover">
                                        </div>
                                        <div class="text-start">
                                            <div id="live-date" class="fw-semibold text-light"></div>
                                            <div id="live-day" class="fw-semibold text-secondary small"></div>
                                        </div>
                                    </div>

                                </div>
                            </div>

                        </div>

                        <div class="row py-2 g-3">
                            <div class="col-12 col-md-6">
                                <div class="card bg-black rounded-4 overflow-hidden"
                                    style="height: 100%; min-height: 200px;">
                                    <img src="assets/columbina.jpg" class="w-100 h-100" style="object-fit: cover;">
                                </div>
                            </div>
                            <div class="col-12 col-md-6">
                                <div class="card bg-black rounded-4 overflow-hidden"
                                    style="height: 100%; min-height: 200px;">
                                    <img src="assets/arlecchino.jpg" class="w-100 h-100" style="object-fit: cover;">
                                </div>
                            </div>
                        </div>

                    </div>

                    <div class="col-12 col-md-4 p-3">
                        <div class="card bg-black rounded-4 overflow-hidden" style="height: 100%; width: 100%;">
                            <img src="assets/elements.jpg" class="w-100 h-100" style="object-fit: cover;">
                        </div>
                    </div>
                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
        function updateDateTime() {
            const now = new Date();

            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            const timeString = `${hours}:${minutes} ${ampm}`;
            document.getElementById('live-clock').textContent = timeString;

            const month = String(now.getMonth() + 1).padStart(2, '0');
            const dayNum = String(now.getDate()).padStart(2, '0');
            const year = now.getFullYear();
            const dateString = `${month}-${dayNum}-${year}`;
            document.getElementById('live-date').textContent = dateString;

            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const dayString = days[now.getDay()];
            document.getElementById('live-day').textContent = dayString;
        }
        updateDateTime();
        setInterval(updateDateTime, 1000);
    </script>

</body>

</html>
