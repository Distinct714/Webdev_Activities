<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>One Piece: Wiki Character Search</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    .character-card {
      background-color: #1a202c;
      border: 1px solid #2d3748;
      border-radius: 12px;
      height: 255px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .character-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>

<body>

  <nav class="navbar navbar-dark bg-black position-fixed top-0 w-100 z-3">
    <div class="container-fluid px-4">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-semibold fs-6 text-decoration-none">
        <img src="assets/logo.png" class="rounded-circle object-fit-contain" style="width: 32px; height: 32px;">
        One Piece: Wiki Character Search
      </a>
    </div>
  </nav>

  <div class="container mt-4 py-4 px-5">

    <div class="row mb-3 mt-4">
      <div class="col-12">
        <img src="assets/banner.jpg" alt="One Piece Banner" class="w-100 rounded-3 object-fit-cover" style="max-height: 480px;">
      </div>
    </div>

    <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-3 mb-4">

      <div class="w-100" style="max-width: 450px;">
        <div class="input-group">
          <input type="text" id="searchInput" class="form-control bg-dark text-white border-secondary" placeholder="Enter Character Name" oninput="handleSearch()">
          <button class="btn btn-outline-secondary px-3 text-white" type="button">
            <img src="assets/search.png" style="width: 20px; height: 20px; object-fit: contain;">
          </button>
        </div>
      </div>

      <nav aria-label="Page navigation">
        <ul class="pagination pagination-md mb-0">
          <li class="page-item" id="prevBtn"><a class="page-link bg-dark text-white border-secondary" role="button" onclick="prev()">Previous</a></li>
          <li class="page-item disabled"><a class="page-link bg-dark text-white border-secondary" id="currentpage">1</a></li>
          <li class="page-item" id="nextBtn"><a class="page-link bg-dark text-white border-secondary" role="button" onclick="next()">Next</a></li>
        </ul>
      </nav>
    </div>

    <div class="row row-cols-2 row-cols-md-3 row-cols-lg-5 g-3 mb-5" id="parent"></div>


    <footer class="text-center text-secondary py-4 border-top border-secondary mt-5">
      <small>Fan-made by Distinct. Images of each character is unavailable on api-onepiece.</small>
    </footer>

  </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

  <script>
    
    function capitalizeFirstLetter(str) {
      if (!str) return str;
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    var elCurrentPage = document.getElementById("currentpage");
    var elParent = document.getElementById("parent");
    var elSearchInput = document.getElementById("searchInput");
    var prevBtn = document.getElementById("prevBtn");
    var nextBtn = document.getElementById("nextBtn");

    const queryString = window.location.search;
    const urlParams = new URLSearchParams(queryString);
    var page = urlParams.get('page');

    if(page == null){
      page = 1;
    } 
    else {
      page = parseInt(page);
    }

    var allCharacters = [];
    var filteredCharacters = [];
    var perPage = 10;
    var finalPage = 1;

    const getCharacters = async () => {
      elParent.innerHTML = `
        <div class="text-center text-muted my-5 w-100">
          <div class="spinner-border text-light" role="status"></div>
          <p class="mt-2">Loading character catalog...</p>
        </div>`;

      const response = await fetch('https://api.api-onepiece.com/v2/characters/en');
      const data = await response.json();
      
      allCharacters = data.map((item, index) => {
        let name = typeof item.name === 'string' ? item.name : (item.name?.en || item.name?.romaji || item.name?.jp || item.french_name || 'Unknown');
        return {
          id: item.id || index + 1,
          name: name,
          avatar: item.avatar || item.image || ''
        };
      });

      filteredCharacters = allCharacters;
      finalPage = Math.ceil(filteredCharacters.length / perPage);
      renderPage();
    };

    function renderPage() {
      finalPage = Math.ceil(filteredCharacters.length / perPage) || 1;
      
      if (page > finalPage) page = finalPage;
      if (page < 1) page = 1;

      elCurrentPage.innerHTML = page;
      prevBtn.classList.toggle('disabled', page <= 1);
      nextBtn.classList.toggle('disabled', page >= finalPage);

      elParent.innerHTML = '';

      var startIndex = (page - 1) * perPage;
      var endIndex = page * perPage;
      var paginatedItems = filteredCharacters.slice(startIndex, endIndex);

      if (paginatedItems.length === 0) {
        elParent.innerHTML = `
          <div class="text-center text-muted my-5 w-100">
            <h5>No characters found.</h5>
          </div>`;
        return;
      }

      for (var i = 0; i < paginatedItems.length; i++) {
        var character = paginatedItems[i];
        var globalIndex = startIndex + i + 1;
        var profileImg = character.avatar || 'assets/logo.png';

        elParent.innerHTML += `
          <div class="col">
            <a href="view.html?id=${character.id}&page=${page}" class="text-decoration-none">
              <div class="card character-card p-3 d-flex flex-column justify-content-center align-items-center text-center bg-dark border-secondary shadow-sm">
                <img src="${profileImg}" class="rounded-circle object-fit-cover mb-2 bg-black" style="width: 64px; height: 64px;" alt="${character.name}">
                <div class="text-white fw-semibold text-truncate small w-100 px-2">
                  #${globalIndex} ${capitalizeFirstLetter(character.name)}
                </div>
              </div>
            </a>
          </div>
        `;
      }
    }
    
    function handleSearch() {
      var query = elSearchInput.value.toLowerCase().trim();
      filteredCharacters = allCharacters.filter(c => c.name.toLowerCase().includes(query));
      page = 1;
      renderPage();
    }

    function prev(){
      page -= 1;
      if(page < 1){
        page = finalPage;
      }
      renderPage();
    }

    function next(){
      page += 1;
      if(page > finalPage){
        page = 1;
      }
      renderPage();
    }
    getCharacters();

  </script>

</body>

</html>
