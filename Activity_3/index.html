<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Genshin Impact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="bg-black text-white">

    <nav class="navbar navbar-dark bg-dark px-4 py-3 m">
        <div class="container-fluid d-flex justify-content-start align-items-center gap-3">
            <img src="assets/logo.png" alt="Genshin Logo" style="width: 50px; height: 50px; object-fit: contain;">
            <span class="navbar-brand mb-0 h4">Genshin Impact: Character Search</span>
        </div>
    </nav>

    <div class="container my-4 mt-5">
        <div class="row">
            <div class="col">
                <div class="card bg-dark border-secondary rounded-2 p-4 shadow">
                    <div class="input-group px-5">
                        <input type="text" class="form-control bg-black text-white border-secondary py-3 px-4"
                            placeholder="Enter Character Name (e.g., venti, zhongli)" id="searchInput">
                        <button class="btn btn-outline-secondary bg-dark text-white border-secondary px-4" type="button"
                            onclick="getCharacter()">
                            <img src="assets/search.png" alt="Search Icon"
                                style="width: 40px; height: 40px; object-fit: contain;">
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container mb-5">
        <div class="row g-4">

            <div class="col-md-6">
                <div
                    class="card bg-dark border-secondary rounded-2 p-5 text-center h-100 d-flex flex-column align-items-center justify-content-center">
                    <div id="imageContainer"
                        class="mx-auto border border-secondary rounded-circle d-flex align-items-center justify-content-center mb-4"
                        style="width: 220px; height: 220px; overflow: hidden;">
                        <img src="" style="max-width: 100%; max-height: 100%; object-fit: contain;" id="image"
                            alt="Character Portrait">
                    </div>

                    <div class="h3 mb-3 fw-bold text-white" id="name">
                        <div class="spinner-border text-light" role="status">
                        </div>
                    </div>

                    <div class="d-flex justify-content-center gap-2 flex-wrap mt-2">
                        <span class="rounded-2 px-4 py-1 fw-bold text-dark" id="type"></span>
                        <span class="rounded-2 px-4 py-1 fw-bold bg-black text-white" id="rarity"></span>
                        <span class="rounded-2 px-4 py-1 fw-bold bg-black text-white" id="weapon"></span>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div
                    class="card bg-dark border-secondary rounded-2 p-5 text-center h-100 shadow d-flex flex-column align-items-center justify-content-center">

                    <div id="nationImageContainer" class="mx-auto d-flex align-items-center justify-content-center mb-2"
                        style="width: 220px; height: 220px;">
                        <img src="" style="max-width: 100%; max-height: 100%; object-fit: contain;" id="nationIcon"
                            alt="Nation Icon">
                    </div>

                    <div class="mb-2 d-flex justify-content-center gap-2 flex-wrap">
                        <span class="px-4 py-2 fw-bold h4 text-white" id="nationBadge"></span>
                    </div>

                    <p class="text-white-50 px-3 fst-italic" id="description" style="min-height: 80px;"></p>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>

        const element_colors = {
            anemo: '#74e5BB',
            geo: '#f8d047',
            electro: '#b081eb',
            dendro: '#a5c83b',
            hydro: '#00c3ff',
            pyro: '#ff7843',
            cryo: '#9bedf3'
        };

        function capitalizeFirstLetter(str) {
            if (!str) return str;
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        var elName = document.getElementById("name");
        var elImage = document.getElementById("image");
        var elType = document.getElementById("type");
        var elRarity = document.getElementById("rarity");
        var elWeapon = document.getElementById("weapon");
        var elNationBadge = document.getElementById("nationBadge");
        var elNationIcon = document.getElementById("nationIcon");
        var elDescription = document.getElementById("description");
        var elImageContainer = document.getElementById("imageContainer");
        var inSearchInput = document.getElementById("searchInput");

        inSearchInput.addEventListener("keypress", function (event) {
            if (event.key === "Enter") {
                getCharacter();
            }
        });

        const getCharacter = async () => {
            const query = inSearchInput.value.trim().toLowerCase().replace(/\s+/g, '-');
            if (!query) return;

            elName.innerHTML = `
        <div class="spinner-border text-light" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      `;
            elImage.src = "";
            elNationIcon.src = "";
            elType.innerHTML = "";
            elRarity.innerHTML = "";
            elWeapon.innerHTML = "";
            elNationBadge.innerHTML = "";
            elDescription.innerHTML = "";
            elImageContainer.style.backgroundColor = "transparent";

            const response = await fetch(`https://genshin.jmp.blue/characters/${query}`);

            if (!response.ok) {
                elName.innerHTML = "Character not found!";
                elNationBadge.innerHTML = "Unknown";
                elDescription.innerHTML = "Please try searching for another character.";
                return;
            }

            const character = await response.json();
            const element = (character.vision || "anemo").toLowerCase();
            const nationSlug = (character.nation || "").toLowerCase().replace(/\s+/g, '-');

            elName.innerHTML = capitalizeFirstLetter(character.name || query);
            elImage.src = `https://genshin.jmp.blue/characters/${query}/icon`;

            const bgColor = element_colors[element] || '#F5F5F5';
            elImageContainer.style.backgroundColor = bgColor;

            elType.innerHTML = (character.vision || "Unknown").toUpperCase();
            elType.style.backgroundColor = bgColor;

            elRarity.innerHTML = `${character.rarity || '?'}-star`;
            elWeapon.innerHTML = character.weapon || "Unknown";
            elNationBadge.innerHTML = character.nation || "Unknown";

            if (nationSlug) {
                elNationIcon.src = `https://genshin.jmp.blue/nations/${nationSlug}/icon`;
            }
            elDescription.innerHTML = character.description ? `“${character.description}”` : "No description available.";
        }

    </script>
</body>

</html>
